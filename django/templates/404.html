{% extends "theme/base.html" %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    .error-container {
        min-height: 70vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .display-1 {
        font-size: 8rem;
        font-weight: 800;
        color: #007bff;
    }
</style>
{% endblock %}

{% block content %}
<div class="container text-center error-container">
    <div class="row">
        <div class="col-md-12">
            <h1 class="display-1">404</h1>
            <h2 class="mb-4 fw-bold">Oops! Page Not Found</h2>
            <p class="lead mb-5 text-secondary">
                The page you are looking for doesn’t exist.
            </p>
            <a href="/" class="btn btn-primary btn-lg px-5 shadow-sm">
                <i class="fas fa-home me-2"></i>Return to Landing Page
            </a>
        </div>
    </div>
</div>
{% endblock %}
