{% extends "theme/base.html" %}
{% load static %}

{% block title %}Report User — SubLink{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'report_user/report_user.css' %}">
{% endblock %}

{% block content %}
<section class="report-user-page" aria-labelledby="report-user-title">
    <div class="report-user-wrap">
        <h1 id="report-user-title" class="report-user-title">Why do you want to report this user?</h1>

        <form class="report-user-form" method="post" action="{% url 'report_user:report-user-form' profile.user_id %}">
            {% csrf_token %}

            <div class="report-user-field">
                <label for="id_reason">Reason of report:</label>
                <input type="text" id="id_reason" name="reason" placeholder="Value">
            </div>

            <fieldset class="report-user-fieldset">
                <legend>How fast should this report be processed:</legend>
                <label><input type="radio" name="speed" value="asap" required> As fast as possible</label>
                <label><input type="radio" name="speed" value="fast"> Fast</label>
                <label><input type="radio" name="speed" value="normal"> Normal</label>
                <label><input type="radio" name="speed" value="less_than_normal"> Less than normal</label>
                <label><input type="radio" name="speed" value="no_rush"> No Rush</label>
            </fieldset>

            <button type="submit" class="report-user-submit">Submit</button>
        </form>
    </div>
</section>
{% endblock %}
