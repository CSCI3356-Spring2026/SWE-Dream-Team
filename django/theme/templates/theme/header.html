{% load static %}

<nav class="navbar">
    <div class="nav-wrapper">
      {% if request.user.profile.user_type == 'renter' %}
          <a href="{% url 'listings-explore-housing' %}" class="logo">
      {% else %}
          <a href="{% url 'roommates-explore' %}" class="logo">
      {% endif %}
            <img src="{% static 'images/SubLink Logo.svg' %}" alt="SubLink Logo" height="100">
        </a>

        {% if user.is_authenticated %}
        <div class="nav-dropdown">
            <button class="dropbtn" onclick="toggleMenu()">
                My Profile
                <i class="fa-regular fa-user"></i>
            </button>
            <div id="dropdown-menu" class="dropdown-content">
              <a href="/profile/preview/">My Profile</a>
              <a href="/home/">Edit My Profile</a>
              {% if request.user.is_staff %}
              <a href="/admin-center/">Admin Panel</a>
              {% endif %}
              <a href="/settings/">Settings</a>
              <a href="/sign-out">Sign Out</a>
            </div>
        </div>
        {% endif %}
    </div>
</nav>

<script>
  function toggleMenu() {
    document.getElementById("dropdown-menu").classList.toggle("show");
  }

  window.onclick = function(event) {
    if (!event.target.matches('.dropbtn')) {
      var dropdowns = document.getElementsByClassName("dropdown-content");
      for (var i = 0; i < dropdowns.length; i++) {
        var openDropdown = dropdowns[i];
        if (openDropdown.classList.contains('show')) {
          openDropdown.classList.remove('show');
        }
      }
    }
  }
</script>
