{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/component/set_card.css' %}">
{% endblock %}

<div class="set_card">
    <div class="info">
        <h4>{{title}}</h4>
        <i class="{{icon}}"></i>
        <ul>
            {% for desc in description %}
            <li>{{ desc }}</li>
            {% endfor %}
        </ul>
    </div>
    <div>
        <form method="post" action="{% url 'set_user_type' %}">
            {% csrf_token %}
            <input type="hidden" name="user_type" value="{{ value }}">
            <button id="{{ link }}" class="set_button">{{ buttontxt }}</button>
        </form>
    </div>
</div>
