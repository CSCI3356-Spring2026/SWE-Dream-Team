{% extends "base.html" %}
{% load static %}

{% block title %}
SubLink
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'landing_page/style.css' %}">
{% endblock %}

{% block content %}

<div class="container">

    <div class="left">
        <h1 class = "logo">SubLink</h1>
        <p class = "tagline">Start Here to Stop the Search</p>
    </div>

    <div class="right">

    <div class = "auth-box">
        <h2>Your next home awaits...</h2>
      
        <div class="toggle-bar">
            <input type = "radio" id="loginToggle" name = "authToggle" checked>
            <label for = "loginToggle" class = "toggle-btn">Log In</label>

            <input type = "radio" id="signupToggle" name = "authToggle">
            <label for = "signupToggle" class = "toggle-btn">Sign Up</label>
        </div>

        <div class = "auth-forms">
            <form class = "form login-form>"
                <input type = "text" placeholder="Email">
                <input type = "password" placeholder = "Password">
                <button type = "submit" class = "btn btn-primary">Log In</button>
            </form>

            <form class = "form signup-Form">
                <input type = "text" placeholder = "Name">
                <input type = "text" placeholder = "Email">
                <input type = "password" placeholder = "Password">
                <button type = "submit" class = "btn btn-primary">Sign Up</button>
            </form>
        </div>

        <div class = "divider">
            <span>or</span>
        </div>

        <a href="/accounts/google/login/">
            <button>Log in with Google</button>
        </a>
        
    </div>

    </div>

</div>

{% endblock %}
