<nav class="forms-workflow-toggle" aria-label="Onboarding workflow">
    <span class="forms-workflow-toggle__intro">You are filling out the form as a:</span>
    <div class="forms-workflow-toggle__buttons" role="group">
        <a
            class="forms-workflow-toggle__btn{% if forms_workflow_mode|default:'renter' == 'renter' %} forms-workflow-toggle__btn--active{% endif %}"
            href="{% url 'forms-set-workflow-mode' 'renter' %}"
            {% if forms_workflow_mode|default:'renter' == 'renter' %}aria-current="page"{% endif %}
        >Renter</a>
        <a
            class="forms-workflow-toggle__btn{% if forms_workflow_mode == 'sublettor' %} forms-workflow-toggle__btn--active{% endif %}"
            href="{% url 'forms-set-workflow-mode' 'sublettor' %}"
            {% if forms_workflow_mode == 'sublettor' %}aria-current="page"{% endif %}
        >Sublettor</a>
    </div>
</nav>
